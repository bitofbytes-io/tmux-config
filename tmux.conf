# set terminal colors
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-ghostty:RGB'
set -as terminal-overrides ',xterm-ghostty:Tc'
set -g escape-time 0
set -g mouse on
set -g set-clipboard on
set -g allow-passthrough on
set -g history-limit 100000

# set prefix
unbind C-b
set -g prefix C-space
bind C-Space send-prefix

# set numbering to start at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# set copy mode
set-window-option -g mode-keys vi

# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1
bind-key C-x set-window-option synchronize-panes\; display-message "synchronize-panes is now #{?pane_synchronized,on,off}"

# List of plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.config/tmux/plugins"
set -g @plugin 'tmux-plugins/tpm#7bdb7ca33c9cc6440a600202b50142f401b6fe21'
set -g @plugin 'tmux-plugins/tmux-sensible#2ce7679f9dcf42dffa60abd59a3405b87cb8213b'
set -g @plugin 'christoomey/vim-tmux-navigator#85b8e5f60c1690cde57dbb66467ce39cd1b63343'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux#b4e0715356f820fc72ea8e8baf34f0f60e891718'
set -g @plugin 'tmux-plugins/tmux-yank#fd8000238b324005389076486a2e6e03dba1c64f'
set -g @plugin 'tmux-plugins/tmux-open#f99d3189c445188eae5fa9bfeabc95df16deca92'
set -g @plugin 'tmux-plugins/tmux-resurrect#e87d7d592cac97fa38c12395ebec042c154a1844'
set -g @plugin 'tmux-plugins/tmux-continuum#46e0e0023476018ddb4cc0d44783eede27e5a8ec'
set -g @plugin 'sainnhe/tmux-fzf#2839d6bd0e13b7c5e385e131e4c217917fa73555'
set -g @plugin 'omerxx/tmux-floax#133f526793d90d2caa323c47687dd5544a2c704b'
set -g @plugin 'fcsonline/tmux-thumbs#5fdab4dbc1493fbc2a82f3e09ac9b2483bd278c3'

# Restore sessions automatically with tmux-continuum and tmux-resurrect
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-dir '~/.config/tmux/resurrect'
set -g @resurrect-delete-backup-after '7'
set -g @shell_mode 'vi'
set -g @thumbs-key 't'

# Startup works before bootstrap. TPM loads the installed pinned checkouts.
if-shell 'test -x "$HOME/.config/tmux/plugins/tpm/tpm"' 'run-shell "~/.config/tmux/plugins/tpm/tpm"'
# Stock TPM cannot clone raw SHA refs or update detached checkouts safely.
# Route install/update keys through the exact-commit installer instead.
bind-key I run-shell 'sh "$HOME/.config/tmux/scripts/install-plugins.sh" && tmux source-file "$HOME/.config/tmux/tmux.conf"'
bind-key U run-shell 'sh "$HOME/.config/tmux/scripts/install-plugins.sh" && tmux source-file "$HOME/.config/tmux/tmux.conf"'
